name: Publish Docker image

# Build the Milvus image and push it to GitHub Container Registry when a version tag is pushed.
on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: read
  packages: write
  actions: write

jobs:
  publish:
    name: Build and push
    runs-on: ubuntu-latest
    timeout-minutes: 360
    steps:
      - name: Maximize build space
        uses: easimon/maximize-build-space@master
        with:
          # Leave a small reserve on /. The rest of the disk is mounted on the
          # workspace. Docker must not keep image layers on /.
          root-reserve-mb: 8192
          temp-reserve-mb: 100
          swap-size-mb: 1024
          remove-dotnet: "true"
          remove-android: "true"
          remove-haskell: "true"
          remove-codeql: "true"
          remove-docker-images: "true"

      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Move Docker data onto the build volume
        run: |
          set -euo pipefail
          sudo systemctl stop docker
          docker_root="${GITHUB_WORKSPACE}/.docker-data"
          sudo mkdir -p "${docker_root}"
          tmp="$(mktemp)"
          if [ -f /etc/docker/daemon.json ]; then
            jq --arg root "${docker_root}" '. + {"data-root": $root}' /etc/docker/daemon.json > "${tmp}"
          else
            jq -n --arg root "${docker_root}" '{"data-root": $root}' > "${tmp}"
          fi
          sudo mv "${tmp}" /etc/docker/daemon.json
          sudo systemctl start docker
          docker info -f 'DockerRootDir={{.DockerRootDir}}'
          df -h

      - name: Image coordinates
        run: |
          owner=$(echo "${{ github.repository_owner }}" | tr '[:upper:]' '[:lower:]')
          echo "MILVUS_IMAGE_REPO=ghcr.io/${owner}/milvus" >> "$GITHUB_ENV"
          echo "MILVUS_IMAGE_TAG=${GITHUB_REF_NAME}" >> "$GITHUB_ENV"

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Restore ccache
        id: ccache
        uses: actions/cache/restore@v4
        with:
          path: .docker/amd64-ubuntu22.04-ccache
          key: ubuntu22.04-ccache-${{ hashFiles('internal/core/**/*.cpp', 'internal/core/**/*.cc', 'internal/core/**/*.c', 'internal/core/**/*.h', 'internal/core/**/*.hpp', 'internal/core/**/CMakeLists.txt') }}
          restore-keys: ubuntu22.04-ccache-

      - name: Restore Conan cache
        id: conan
        uses: actions/cache/restore@v4
        with:
          path: .docker/amd64-ubuntu22.04-conan2
          key: ubuntu22.04-conan2-${{ hashFiles('internal/core/conanfile.py') }}
          restore-keys: ubuntu22.04-conan2-

      - name: Restore Go module cache
        id: gomod
        uses: actions/cache/restore@v4
        with:
          path: .docker/amd64-ubuntu22.04-go-mod
          key: ubuntu22.04-go-mod-${{ hashFiles('go.sum', 'pkg/go.sum', 'client/go.sum') }}
          restore-keys: ubuntu22.04-go-mod-

      - name: Build Milvus
        run: ./build/builder.sh make install

      - name: Save ccache
        if: steps.ccache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: .docker/amd64-ubuntu22.04-ccache
          key: ${{ steps.ccache.outputs.cache-primary-key }}

      - name: Save Conan cache
        if: steps.conan.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: .docker/amd64-ubuntu22.04-conan2
          key: ${{ steps.conan.outputs.cache-primary-key }}

      - name: Save Go module cache
        if: steps.gomod.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: .docker/amd64-ubuntu22.04-go-mod
          key: ${{ steps.gomod.outputs.cache-primary-key }}

      - name: Build image
        run: ./build/build_image.sh

      - name: Push image
        run: docker push "${MILVUS_IMAGE_REPO}:${MILVUS_IMAGE_TAG}"
